
server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:gaokao_volunteer;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER,YEAR,VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: gaokao-volunteer-jwt-secret-key-2024
  expiration: 86400000

logging:
  level:
    com.example.gaokao: DEBUG
    org.springframework.security: INFO
