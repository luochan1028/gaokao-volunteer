
server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gaokao_volunteer?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    mongodb:
      uri: mongodb://localhost:27017/gaokao_policy

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: gaokao-volunteer-jwt-secret-key-2024
  expiration: 86400000

logging:
  level:
    com.example.gaokao: DEBUG
    org.springframework.security: INFO
